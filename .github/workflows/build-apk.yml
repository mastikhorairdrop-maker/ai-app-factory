name: Build Android Native APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android App with Manual License Injection
        run: |
          echo "Injecting Android SDK licenses manually..."
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          
          # Create license directory and write official hashes to bypass all prompts
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea3c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a648b0" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b8509b261f129a16b75f0f03102d1d07c40" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "89335865a6b6d1e7714f31b068826553d3607062" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b8509b261f129a16b75f0f03102d1d07c40" > $ANDROID_HOME/licenses/android-sdk-preview-license

          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          # Generate Clean Project Files
          mkdir -p app/src/main/java/com/example/aiappfactory
          mkdir -p app/src/main/res/values

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AIAppFactory"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace 'com.example.aiappfactory'
              compileSdk 33

              defaultConfig {
                  applicationId "com.example.aiappfactory"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="AI App Factory"
                  android:theme="@style/Theme.AppCompat.Light">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/aiappfactory/MainActivity.kt
          package com.example.aiappfactory

          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this)
                  tv.text = "AI App Factory Successful!"
                  setContentView(tv)
              }
          }
          EOF

          # Download and run Gradle 8.1.1 directly
          wget -q https://services.gradle.org/distributions/gradle-8.1.1-bin.zip -O gradle-8.1.1.zip
          unzip -q gradle-8.1.1.zip
          export PATH=$PWD/gradle-8.1.1/bin:$PATH
          
          gradle --version
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-App-Factory-APK
          path: app/build/outputs/apk/debug/app-debug.apk
